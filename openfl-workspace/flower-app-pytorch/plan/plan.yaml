aggregator :
  defaults : plan/defaults/aggregator.yaml
  template : openfl.component.Aggregator
  settings :
    rounds_to_train : 1 #DO NOT EDIT

flex : 
  defaults : plan/defaults/flex.yaml
  template : openfl.component.FLEXFlower
  settings :
    superlink_params :
      insecure : True
      serverappio-api-address : 127.0.0.1:9091
      fleet-api-address :  127.0.0.1:9092 # note [kta-intel]: local gRPC client will connect here
      exec-api-address : 127.0.0.1:9093 # note [kta-intel]: port for server-app toml
    flwr_run_params :
      flwr_app_name : "app-pytorch"
      federation_name : "local-poc"

collaborator :
  defaults : plan/defaults/collaborator.yaml
  template : openfl.component.Collaborator

data_loader :
  defaults : plan/defaults/data_loader.yaml
  template : openfl.federated.data.loader_flower.FlowerDataLoader
  settings :
    collaborator_count : 2

task_runner :
  defaults : plan/defaults/task_runner.yaml
  template : openfl.federated.task.runner_flower.FlowerTaskRunner
  settings :
    auto_shutdown : True

network :
  defaults : plan/defaults/network.yaml

assigner :
  defaults : plan/defaults/assigner.yaml
  template : openfl.component.FLEXAssigner
  settings :
    task_groups :
      - name  : FLEX_Flower
        tasks : 
          - start_client_adapter

tasks :
  defaults : plan/defaults/tasks_flex.yaml

compression_pipeline :
  defaults : plan/defaults/compression_pipeline.yaml